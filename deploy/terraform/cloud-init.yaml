#cloud-config
# The pcd-ops image is pre-provisioned — nginx, the OpenRC service, and all
# dependencies are already installed. This cloud-init only writes an empty .env.
# Without the PCD App Catalog's /etc/pcd-app/config.env, the first visit to the web UI
# asks for the Keystone URL and project, then the admin logs in with their PCD account.
write_files:
  - path: /opt/pcd-ops/.env
    permissions: '0600'
    owner: pcd-ops:pcd-ops
    content: |
      PROMETHEUS_URL=
      GRAFANA_URL=
      GRAFANA_TOKEN=
      # AI_BACKEND=ollama
      # AI_URL=http://localhost:11434
      # AI_MODEL=llama3.1:8b
      # AI_API_KEY=
