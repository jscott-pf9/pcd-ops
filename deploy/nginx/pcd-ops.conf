# PCD Ops (APPLIANCE_STANDARD §7.9): HTTPS on 443 with the certificate in
# /var/lib/pcd-ops/tls (self-signed at first boot by deploy/scripts/tls.sh; replaced from
# Settings → HTTPS). Port 80 always answers /api/health for the catalog's health check, and
# otherwise redirects to HTTPS or serves the app too, as tls/http.conf says.
#
# Copied to /etc/nginx/http.d/pcd-ops.conf by the image build, or by the console's
# Enable HTTPS on appliances built before it.

server {
    listen 80;
    server_name _;

    location = /api/health {
        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_set_header Host $host;
    }

    include /var/lib/pcd-ops/tls/http.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /var/lib/pcd-ops/tls/cert.pem;
    ssl_certificate_key /var/lib/pcd-ops/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:pcdops:10m;
    ssl_session_timeout 1d;

    include /opt/pcd-ops/deploy/nginx/pcd-ops-app.conf;
}
