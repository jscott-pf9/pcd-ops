server {
    listen 80;
    server_name _;

    root /opt/pcd-ops/frontend/dist;
    index index.html;

    # Proxy API requests to FastAPI backend
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Long timeout for AI analysis endpoints
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite content-hashed assets (/assets/index-HASH.js etc.) — cache forever
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — never cache index.html so updates are visible immediately
    # after an in-app upgrade (index.html is the only file without a content hash)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
